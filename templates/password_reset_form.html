<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Password | RHMS</title>
    <style>
        :root {
            --bg-main: #1a1a1a;
            --bg-card: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --primary-blue: #3498db;
            --border-color: rgba(255,255,255,0.1);
            --input-bg: #242424;
        }

        body {
            font-family: 'Raleway', sans-serif;
            background-color: var(--bg-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        h2 { color: var(--text-primary); margin-top: 0; text-align: center; }
        p { color: var(--text-secondary); font-size: 0.9rem; }

        /* Styling the Django-generated inputs */
        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            background: var(--input-bg);
            color: var(--text-primary);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit:hover { background: #2980b9; }
        
        ul.errorlist { color: #e74c3c; font-size: 0.8rem; padding-left: 0; list-style: none; }
    </style>
</head>
<body>

<div class="auth-container">
    <h2>New Password</h2>
    <p>Please enter your new password twice so we can verify you typed it correctly.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-submit">Update Password</button>
    </form>
</div>

</body>
</html>
