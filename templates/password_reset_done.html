<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Complete | RHMS</title>
    <style>
        :root {
            --bg-main: #1a1a1a;
            --bg-card: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --primary-blue: #3498db;
            --border-color: rgba(255,255,255,0.1);
            --success-green: #2ecc71;
        }

        body {
            font-family: 'Raleway', sans-serif;
            background-color: var(--bg-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        h2 { color: var(--success-green); margin-top: 0; }
        p { color: var(--text-secondary); margin-bottom: 30px; }

        .btn-login {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--primary-blue);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <h2>Success!</h2>
    <p>Your password has been successfully reset. You can now use your new credentials to log in.</p>

    <a href="{% url 'login' %}" class="btn-login">Log In Now</a>
</div>

</body>
</html>
