<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | RHMS</title>
    <style>
        :root {
            --bg-main: #1a1a1a; /* Adjust to your main background color */
            --bg-card: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --primary-blue: #3498db;
            --border-color: rgba(255,255,255,0.1);
            --input-bg: #242424;
            --input-border: #333;
        }

        body {
            font-family: 'Raleway', sans-serif;
            background-color: var(--bg-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        h2 { color: var(--text-primary); margin-top: 0; }
        p { color: var(--text-secondary); font-size: 0.95rem; line-height: 1.5; }

        input[type="email"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box; /* Important for width */
            background: var(--input-bg);
            color: var(--text-primary);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover { background: #2980b9; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover { color: var(--primary-blue); }
    </style>
</head>
<body>

<div class="auth-container">
    <h2>Forgot Password?</h2>
    <p>No worries! Enter your email and we'll send you a link to reset your password.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.email }}
        <button type="submit" class="btn-submit">Send Reset Link</button>
    </form>

    <a href="{% url 'login' %}" class="back-link">← Back to Login</a>
</div>

</body>
</html>
