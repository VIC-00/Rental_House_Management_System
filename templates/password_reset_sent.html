<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Sent | RHMS</title>
    <style>
        :root {
            --bg-main: #1a1a1a;
            --bg-card: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --primary-blue: #3498db;
            --border-color: rgba(255,255,255,0.1);
            --success-green: #2ecc71;
        }

        body {
            font-family: 'Raleway', sans-serif;
            background-color: var(--bg-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        h2 { color: var(--success-green); margin-top: 0; }
        p { color: var(--text-secondary); font-size: 0.95rem; line-height: 1.6; }

        .back-link {
            display: block;
            margin-top: 20px;
            color: var(--primary-blue);
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <h2>Email Sent!</h2>
    <p>We’ve emailed you instructions for setting your password. If an account exists with the email you entered, you should receive it shortly.</p>
    <p style="font-size: 0.85rem; margin-top: 10px;">Don't see it? Check your spam folder.</p>

    <a href="{% url 'login' %}" class="back-link">← Back to Login</a>
</div>

</body>
</html>
